name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        deps-file: deps.cirru
        tools: calcit,caps
        caps-version: '0.1.1'

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit --check-only --ns 'app.$meta' --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.updater --ns app.util
        calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit --entry server --check-only --ns app.server --ns app.schema --ns app.util
        calcit fix --workflow strict --verify --format edn
        calcit test app.schema --require-match
        calcit --entry server analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit --entry server analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
        calcit calcit.cirru --entry server analyze quality --baseline config/calcit-quality-server.cirru

    - name: Compile browser and server bundles
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        calcit calcit.cirru --entry server --emit-path server-out/ js
    - name: Select frontend CDN path
      id: asset-path
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=https://cos-sh.tiye.me/${asset_prefix}" >> "$GITHUB_OUTPUT"

    - name: Build frontend demo for CDN
      env:
        VITE_BASE_URL: ${{ steps.asset-path.outputs.base-url }}
      run: yarn vite build --base="$VITE_BASE_URL"

    - name: Check COS credentials
      id: cos-credentials
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "::warning::COS credentials unavailable; public upload verification skipped."
        else
          echo "::error::COS credentials required before production frontend deployment."
          exit 1
        fi

    - name: Upload and verify frontend resources
      if: steps.cos-credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
