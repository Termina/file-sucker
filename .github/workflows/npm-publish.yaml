
name: npm publish

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0
      with:
        tools: calcit,caps

    - name: Resolve immutable dependencies
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        set -euo pipefail
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze dynamic-methods --max 0
        calcit calcit.cirru analyze deprecated --summary-only
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru --entry server --check-only
        calcit calcit.cirru --entry server analyze dynamic-methods --max 0
        calcit calcit.cirru --entry server analyze deprecated --summary-only
        calcit calcit.cirru --entry server analyze quality --baseline config/calcit-quality-server.cirru

    - name: Compile browser and server bundles
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        calcit calcit.cirru --entry server --emit-path server-out/ js
        yarn vite build --base=./

    - name: publish
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{secrets.npm_token}}
